name: Release gates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-and-leaks:
    name: Sanitizer fuzzing and full leak detection
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # FULL_LEAK_CHECK removes the ordinary GPU-test LeakSanitizer exemption.
      # Hosted release runners have no NVIDIA driver, so self-skipping GPU
      # cases do not introduce the driver's process-global false positives.
      - name: Run all tests, deterministic fuzz cases, and leak checks
        run: >-
          make -C src clean all test CC=clang ASAN=1 FULL_LEAK_CHECK=1

  undefined-behavior:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run all tests and deterministic fuzz cases
        run: make -C src clean all test CC=clang UBSAN=1

  reproducible-builds:
    name: Reproducible GCC and Clang builds
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare clean builds and same-seed artifacts
        run: bash src/tools/check_reproducible_builds.sh gcc clang

  openmp:
    name: GCC OpenMP runtime paths
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the complete parallel suite
        run: make -C src clean all test CC=gcc OMP=1

  packages:
    name: Reproducible release packages
    needs: [fuzz-and-leaks, undefined-behavior, reproducible-builds, openmp]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and reproduce the release archives
        run: make -C src release-package-check release-package CC=gcc

      - name: Upload normalized archives and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  reference-model:
    name: Reproduce small reference model
    needs: [packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Train, evaluate, and package the pinned recipe
        run: >-
          scripts/reference/publish_shakespeare_small.sh publish
          --output dist/reference/shakespeare-small-v1

      - name: Reject corrupted reference packages
        run: >-
          src/tests/integration/test_reference_package.sh
          dist/reference/shakespeare-small-v1
          scripts/reference/publish_shakespeare_small.sh

      - name: Upload the model, provenance, and expected metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shakespeare-small-v1-${{ github.run_number }}
          path: dist/reference/shakespeare-small-v1/
          if-no-files-found: error
          retention-days: 90
